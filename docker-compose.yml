services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ontologyready
      POSTGRES_USER: ontologyready
      POSTGRES_PASSWORD: ontologyready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontologyready"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ontologyready:ontologyready@postgres:5432/ontologyready
      API_KEY: ${API_KEY:-ontologyready-dev-key}
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_KEY: ${API_KEY:-ontologyready-dev-key}

volumes:
  pgdata:
